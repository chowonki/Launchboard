# Launchboard 릴리스 빌드
# - v로 시작하는 태그를 푸시하면 실행됩니다 (예: git tag v1.0.5 && git push origin v1.0.5)
# - Actions 탭 → Release → Run workflow 로 수동 실행도 가능합니다
# - main 푸시·PR에서는 실행되지 않습니다 (macOS 러너 사용량 절약)
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0.5). 비우면 프로젝트의 MARKETING_VERSION 사용"
        required: false
        default: ""
      draft:
        description: "초안(Draft)으로 만들기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release (Universal)
    runs-on: macos-15-intel   # Apple Silicon 호스트는 대기열이 잘 안 풀려 Intel 호스트 사용 (결과물은 Universal)
    timeout-minutes: 30

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v5

      - name: 최신 Xcode 선택
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 프로젝트 준비 (xcodeproj 압축 해제)
        run: |
          if [ ! -d Launchboard.xcodeproj ] && [ -f Launchboard.xcodeproj.zip ]; then
            unzip -q Launchboard.xcodeproj.zip -x "__MACOSX/*"
          fi
          if [ ! -d Launchboard.xcodeproj ]; then
            echo "::error::Launchboard.xcodeproj가 없습니다."
            exit 1
          fi
          if [ ! -d Launchboard ]; then
            echo "::error::소스 폴더 'Launchboard/'(App, Model, Views, Support, Assets.xcassets)가 저장소에 없습니다. 먼저 커밋해 주세요."
            exit 1
          fi

      - name: 버전 결정
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(grep -m1 "MARKETING_VERSION" Launchboard.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);.*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "버전: $VERSION"

      - name: Release 빌드 (Apple Silicon + Intel)
        run: |
          set -o pipefail
          xcodebuild \
            -project Launchboard.xcodeproj \
            -scheme Launchboard \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            build | tee build-log.txt | grep -E "error:|warning: .*Launchboard|BUILD" || true
          test -d build/Build/Products/Release/Launchboard.app || { echo "::error::빌드 실패 (build-log 아티팩트 확인)"; exit 1; }

      - name: 빌드 로그 보관 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build-log.txt
          retention-days: 7

      - name: 서명 확인 및 ZIP 만들기
        run: |
          APP=build/Build/Products/Release/Launchboard.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "아키텍처: $(lipo -archs "$APP/Contents/MacOS/Launchboard")"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Launchboard.zip

          # 배포 ZIP을 다시 풀어 서명 유효성 재검사
          mkdir -p verify && ditto -x -k Launchboard.zip verify
          codesign --verify --deep --strict verify/Launchboard.app
          shasum -a 256 Launchboard.zip | tee Launchboard.zip.sha256

      - name: GitHub Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "Launchboard $VERSION" > notes.md; NOTES=notes.md; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "기존 릴리스 $TAG 에 파일 덮어쓰기"
            gh release upload "$TAG" Launchboard.zip Launchboard.zip.sha256 --clobber
          else
            DRAFT=""
            [ "${{ inputs.draft }}" = "true" ] && DRAFT="--draft"
            gh release create "$TAG" Launchboard.zip Launchboard.zip.sha256 \
              --title "Launchboard $VERSION" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA" $DRAFT
          fi
